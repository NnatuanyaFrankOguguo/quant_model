# Alembic configuration — quant_model.
#
# There is deliberately NO `sqlalchemy.url` here. The URL is a credential; putting it in a
# committed ini file is how connection strings end up in git history. `db/migrations/env.py`
# resolves it from `packages.common.config`, which reads `.env` (gitignored).
#
# Target selection (env.py):
#   QUANT_DB_TARGET=dev   (default) -> Settings.database_url
#   QUANT_DB_TARGET=test            -> Settings.test_database_url

[alembic]
script_location = db/migrations
prepend_sys_path = .
path_separator = os
# Revision filenames: 0001_p0_spine.py, 0002_..., ordered on disk the way they run.
file_template = %%(rev)s_%%(slug)s

[post_write_hooks]

# Logging. `sqlalchemy.engine` stays at WARN: at INFO it echoes the connection URL,
# password included, into every migration run's output and into CI logs.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
